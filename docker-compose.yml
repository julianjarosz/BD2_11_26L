services:
  operational-db:
    image: postgres:16-alpine
    container_name: weather-operational-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPERATIONAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${OPERATIONAL_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${OPERATIONAL_DB_NAME:-weather_operational}
    ports:
      - "${OPERATIONAL_DB_PORT:-5432}:5432"
    volumes:
      - operational_data:/var/lib/postgresql/data
      - ./operational_database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPERATIONAL_DB_USER:-postgres} -d ${OPERATIONAL_DB_NAME:-weather_operational}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - weather-net

  warehouse-db:
    image: postgres:16-alpine
    container_name: weather-warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-weather_warehouse}
    ports:
      - "${WAREHOUSE_DB_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./data_warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:-postgres} -d ${WAREHOUSE_DB_NAME:-weather_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - weather-net

  airflow-db:
    image: postgres:16-alpine
    container_name: weather-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - weather-net

  python-app:
    image: weather-python-app-image
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: weather-python-app
    restart: "no"
    environment:
      POSTGRES_DSN: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      WAREHOUSE_POSTGRES_DSN: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      PIPELINE_MODE: ${PIPELINE_MODE:-all}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    depends_on:
      operational-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    networks:
      - weather-net

  airflow-init:
    image: weather-airflow-image
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: weather-airflow-init
    restart: "no"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-weather-airflow-secret-key}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AIRFLOW_FIRSTNAME: ${AIRFLOW_FIRSTNAME:-Admin}
      AIRFLOW_LASTNAME: ${AIRFLOW_LASTNAME:-User}
      AIRFLOW_EMAIL: ${AIRFLOW_EMAIL:-admin@example.com}
      AIRFLOW_CONN_OPERATIONAL_POSTGRES: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      POSTGRES_DSN: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      WAREHOUSE_POSTGRES_DSN: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      DATABASE_URL: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username \"$${AIRFLOW_USERNAME}\"
      --password \"$${AIRFLOW_PASSWORD}\"
      --firstname \"$${AIRFLOW_FIRSTNAME}\"
      --lastname \"$${AIRFLOW_LASTNAME}\"
      --role Admin
      --email \"$${AIRFLOW_EMAIL}\" || true"
    depends_on:
      airflow-db:
        condition: service_healthy
    volumes:
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    networks:
      - weather-net

  airflow-webserver:
    image: weather-airflow-image
    container_name: weather-airflow-webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-weather-airflow-secret-key}
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
      AIRFLOW_CONN_OPERATIONAL_POSTGRES: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      POSTGRES_DSN: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      WAREHOUSE_POSTGRES_DSN: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      DATABASE_URL: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      operational-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    volumes:
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    networks:
      - weather-net

  airflow-scheduler:
    image: weather-airflow-image
    container_name: weather-airflow-scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-weather-airflow-secret-key}
      AIRFLOW_CONN_OPERATIONAL_POSTGRES: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      POSTGRES_DSN: postgresql://${OPERATIONAL_DB_USER:-postgres}:${OPERATIONAL_DB_PASSWORD:-postgres}@operational-db:5432/${OPERATIONAL_DB_NAME:-weather_operational}
      WAREHOUSE_POSTGRES_DSN: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      DATABASE_URL: postgresql://${WAREHOUSE_DB_USER:-postgres}:${WAREHOUSE_DB_PASSWORD:-postgres}@warehouse-db:5432/${WAREHOUSE_DB_NAME:-weather_warehouse}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      operational-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    volumes:
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    networks:
      - weather-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weather-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      operational-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge

volumes:
  operational_data:
  warehouse_data:
  airflow_db_data:
  airflow_logs:
  pgadmin_data:
  redis_data:
