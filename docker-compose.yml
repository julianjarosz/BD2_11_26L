services:
  operational-db:
    image: postgres:16-alpine
    container_name: weather-operational-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPERATIONAL_DB_USER}
      POSTGRES_PASSWORD: ${OPERATIONAL_DB_PASSWORD}
      POSTGRES_DB: ${OPERATIONAL_DB_NAME}
    ports:
      - "${OPERATIONAL_DB_PORT:-5432}:5432"
    volumes:
      - operational_data:/var/lib/postgresql/data
      - ./operational_database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPERATIONAL_DB_USER} -d ${OPERATIONAL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - weather-net

  warehouse-db:
    image: postgres:16-alpine
    container_name: weather-warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
    ports:
      - "${WAREHOUSE_DB_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./data_warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - weather-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weather-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      operational-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge

volumes:
  operational_data:
  warehouse_data:
  pgadmin_data:
