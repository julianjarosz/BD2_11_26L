[project]
name = "bd2"
version = "0.1.0"
description = "Weather API helper scripts"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "psycopg[binary]>=3.2.0",
    "redis>=6.0.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pylint>=3.0.0",
    "pytest>=8.0.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint."messages control"]
disable = [
    "R0902",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
]

[tool.pylint.basic]
good-names = [
    "_",
    "i",
    "j",
    "k",
    "X",
    "y",
    "X0",
    "X1",
    "X_batch",
    "X_flat",
    "X_scaled",
    "X_tensor",
    "X_test",
    "X_train",
    "X_train_flat",
    "batch_X",
    "dict_row",
    "psycopg",
    "PostgresContainer",
    "returned_X",
    "scaler_X",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
markers = [
    "integration: tests that require Docker and PostgreSQL via testcontainers",
]
