[project]
name = "bd2"
version = "0.1.0"
description = "Weather API helper scripts"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "redis>=6.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pylint>=3.0.0",
]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint."messages control"]
disable = ["R0902"]
