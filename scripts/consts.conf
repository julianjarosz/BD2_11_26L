[redis]
default_data_key_prefix = database:data
default_schema_key_prefix = database:schema
url_env_var = REDIS_URL
scan_count = 100

[postgresql]
dsn_env_var = POSTGRES_DSN

[openweather]
base_url_1 = https://api.openweathermap.org/data/2.5/weather
api_key_env_var_1 = OPENWEATHER_API_KEY_1

base_url_2 = ...
api_key_env_var_2 = OPENWEATHER_API_KEY_2

base_url_3 = ...
api_key_env_var_3 = OPENWEATHER_API_KEY_3 

base_url_4 = ...
api_key_env_var_4 = OPENWEATHER_API_KEY_4 

base_url_5 = ...
api_key_env_var_5 = OPENWEATHER_API_KEY_5 

default_timeout_seconds = 10.0
default_city = Warsaw
fetch_interval_seconds = 5.0

[database_payload]
default_sender = unknown
